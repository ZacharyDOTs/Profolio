<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zachary Yang</title>
<meta name="description" content="Zachary Yang — photography &amp; video portfolio">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M9 9h14L9 23h14' fill='none' stroke='%23fafafa' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="name" href="./">Zachary Yang</a>
    <div class="right">
      <nav class="filters" aria-label="作品類型">
        <button class="f on" data-filter="all" aria-pressed="true">ALL</button>
        <button class="f" data-filter="photo" aria-pressed="false">平面</button>
        <button class="f" data-filter="video" aria-pressed="false">動態</button>
      </nav>
      <a class="mail" href="mailto:younger0226work@gmail.com">younger0226work@gmail.com</a>
    </div>
  </header>
  <main>
    <div id="hero"></div>
    <div id="grid" class="grid"></div>
    <p id="msg" class="msg" hidden></p>
  </main>
</div>

<dialog id="lightbox" aria-label="照片檢視">
  <div class="lb-top">
    <div class="lb-cap"><span id="lbTitle"></span><span id="lbCat"></span></div>
    <span id="lbCount" class="lb-count"></span>
    <button id="lbClose" class="lb-btn" aria-label="關閉"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 4l12 12M16 4L4 16"/></svg></button>
  </div>
  <div class="lb-stage">
    <button id="lbPrev" class="lb-btn" aria-label="上一張"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 4l-7 7 7 7"/></svg></button>
    <img id="lbImg" alt="">
    <button id="lbNext" class="lb-btn" aria-label="下一張"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 4l7 7-7 7"/></svg></button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
